    <main class="vh-100">
        <div class="container mt-5 pt-5 mb-0">
            <h1 class="text-center mb-4">Quiz</h1>
            <form id="quizForm" onsubmit="calculateScore(event)">
                <div class="form-group mt-3">
                    <label for="question1">1. Em que ano foi a primeira edição do Sound Waves?</label>
                    <select class="form-control" id="question1" required>
                        <option value="">Selecione</option>

                        <option>2005</option>

                        <option>2007</option>

                </div>
                <div class="form-group mt-3">
                    <label for="question2">2. Qual destes DJs tocou mais vezes no Sound Waves?</label>
                    <select class="form-control" id="question2" required>
                        <option value="">Selecione</option>
                        <option>Nico Moreno</option>
                        <option>Carlos Manaça</option>
                        <option>Miss Sheila</option>
                        <option>Fatima Hajji</option>
                    </select>
                </div>
                <div class="form-group mt-3">
                    <label for="question3">3. Quem foi o último DJ a tocar no SoundWaves 2022?</label>
                    <select class="form-control" id="question3" required>
                        <option value="">Selecione</option>
                        <option>Ornella</option>
                        <option>999999999</option>
                        <option>Basswell</option>
                        <option>Cristobal Pesce</option>
                    </select>
                </div>
                <div class="form-group mt-3">
                    <label for="question4">4. Quantos DJs vão estar no SoundWaves 2024?</label>
                    <select class="form-control" id="question4" required>
                        <option value="">Selecione</option>
                        <option>16</option>
                        <option>20</option>
                        <option>11</option>
                        <option>18</option>
                    </select>
                </div>
                <div class="form-group mt-3">
                    <label for="question4">5. Qual é a nacionalidade dos DJs I Hate Models e Shlømo?</label>
                    <select class="form-control" id="question5" required>
                        <option value="">Selecione</option>
                        <option>Portuguesa</option>
                        <option>Espanhola</option>
                        <option>Italiana</option>
                        <option>Francesa</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-purple btn-block mt-3" id="submitButton">Enviar</button>
            </form>
            <div id="result" class="mt-4 text-center"></div>
        </div>
        <!--Função calculateScore para calcular a pontuação do quiz e exibir o resultado.
         Desenvolvido pelo ChatGPT. -->
        <script>
            function calculateScore(event) {
                event.preventDefault();

                const answers = {
                    question1: '2005',
                    question2: 'Miss Sheila',
                    question3: '999999999',
                    question4: '16',
                    question5: 'Francesa'
                };

                let score = 0;
                for (const question in answers) {
                    const userAnswer = document.getElementById(question).value;
                    if (userAnswer === answers[question]) {
                        score++;
                    }
                }

                const resultDiv = document.getElementById('result');
                const totalQuestions = Object.keys(answers).length;

                if (score === totalQuestions) {
                    const discountCode = 'DESCONTO5';
                    resultDiv.innerHTML = `Parabéns! Acertaste as perguntas todas! Usa o código <u><strong>${discountCode}</strong></u> para 5% de desconto.`;
                } else {
                    resultDiv.innerHTML = `Você acertou ${score} de ${totalQuestions} perguntas.`;
                }
                // Desabilitar campos de seleção e mudar o botão
                document.querySelectorAll('select').forEach(select => select.disabled = true);
                const submitButton = document.getElementById('submitButton');
                submitButton.innerHTML = 'Voltar à Home';
                submitButton.onclick = function () {
                    window.location.href = 'index.html';
                };
                submitButton.type = 'button';
            }
        </script>
